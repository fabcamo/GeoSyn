[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GeoSyn"
version = "1.0.0"
description = "Generate synthetic geotechnical 2D cross-sections for data-driven applications"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    {name = "Fabian Campos Montero", email = "fabian.camposmontero@deltares.nl"}
    ]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "h5py>=3.11",
    "gstools>=1.5",
]

[project.urls]
Repository = "https://github.com/fabcamo/GeoSyn"
